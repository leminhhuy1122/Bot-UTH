<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6fbf7" />
      <stop offset="100%" stop-color="#c4f3e8" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a896" />
      <stop offset="100%" stop-color="#028071" />
    </linearGradient>
    <linearGradient id="eyeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#11998e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#028071" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="#00a896" stroke-width="2.5" />
  
  <!-- Outer Aura Ring -->
  <circle cx="50" cy="50" r="43" fill="none" stroke="#a7f3d0" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Robot Ears / Headphones -->
  <rect x="18" y="42" width="7" height="18" rx="3.5" fill="url(#tealGrad)" filter="url(#shadow)" />
  <rect x="75" y="42" width="7" height="18" rx="3.5" fill="url(#tealGrad)" filter="url(#shadow)" />
  <!-- Headphone Band -->
  <path d="M 22 44 Q 50 18 78 44" fill="none" stroke="url(#tealGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Little Antenna -->
  <line x1="50" y1="28" x2="50" y2="20" stroke="url(#tealGrad)" stroke-width="3" stroke-linecap="round" />
  <circle cx="50" cy="18" r="4" fill="#00d2b4" filter="url(#shadow)" />

  <!-- Robot Head Outline / White Body -->
  <rect x="23" y="27" width="54" height="46" rx="18" fill="#ffffff" filter="url(#shadow)" stroke="#e2e8f0" stroke-width="1" />

  <!-- Black Face Visor Screen -->
  <rect x="29" y="34" width="42" height="28" rx="10" fill="#0f172a" />

  <!-- Screen Gloss reflection -->
  <path d="M 32 37 Q 50 35 68 37 C 62 40 38 41 32 37 Z" fill="#ffffff" opacity="0.15" />

  <!-- Glowing Eyes -->
  <rect x="36" y="42" width="9" height="11" rx="4.5" fill="#00f2fe" />
  <rect x="55" y="42" width="9" height="11" rx="4.5" fill="#00f2fe" />
  <!-- Eye pupil reflection -->
  <circle cx="38" cy="44" r="1.5" fill="#ffffff" />
  <circle cx="57" cy="44" r="1.5" fill="#ffffff" />

  <!-- Subtle Cute Mouth -->
  <path d="M 46 54 Q 50 58 54 54" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" />

  <!-- Cheeks blush -->
  <circle cx="34" cy="53" r="2.5" fill="#2dd4bf" opacity="0.35" />
  <circle cx="66" cy="53" r="2.5" fill="#2dd4bf" opacity="0.35" />

  <!-- Bottom Collar / Neck -->
  <path d="M 38 73 L 62 73 L 66 82 L 34 82 Z" fill="url(#tealGrad)" opacity="0.9" rx="3" />
  <rect x="42" y="76" width="16" height="3" rx="1.5" fill="#ffffff" opacity="0.8" />
</svg>

